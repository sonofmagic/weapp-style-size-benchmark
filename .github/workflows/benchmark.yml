name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare current-run evidence
        run: rm -rf reports/evidence .bench
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm bench
      - run: pnpm report:check
      - name: Upload validated benchmark
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: style-size-benchmark-complete
          path: |
            reports/
            !reports/page-growth/**
            .bench/fixtures/**/dist/**
            .bench/logs/**
            .bench/run.json
            README.md
          if-no-files-found: warn
          include-hidden-files: true
      - name: Upload current-run failure evidence
        uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: style-size-benchmark-failed
          path: |
            reports/evidence/
            .bench/fixtures/**/dist/**
            .bench/logs/**
            .bench/run.json
          if-no-files-found: warn
          include-hidden-files: true

  page-growth:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Invalidate committed page-growth evidence
        run: rm -rf reports/page-growth .bench
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec node src/experiments/page-growth.mjs --concurrency=3
      - run: pnpm exec node src/experiments/validate-page-growth.mjs
      - run: pnpm exec node src/experiments/report-page-growth.mjs
      - run: pnpm exec node src/experiments/report-page-growth.mjs --check
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r src/experiments/requirements-chart.txt
      - run: python src/experiments/plot-page-growth.py
      - name: Upload current page-growth results and evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-growth-current-run
          path: |
            reports/page-growth/
            .bench/page-growth/run.json
            .bench/page-growth/logs/**
            .bench/page-growth/fixtures/**/dist/**
          include-hidden-files: true
          if-no-files-found: warn
